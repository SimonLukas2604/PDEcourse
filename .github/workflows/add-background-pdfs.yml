name: Add Dimassi-Sjostrand background PDF

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-background-pdfs.yml'

permissions:
  contents: write

jobs:
  add-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Background-material
        uses: actions/checkout@v4
        with:
          ref: Background-material
          fetch-depth: 0

      - name: Download Dimassi-Sjostrand
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' --output DimassiSjoestrand.pdf 'https://archive.org/download/spectralasymptot00dima/spectralasymptot00dima.pdf'
          test "$(head -c 4 DimassiSjoestrand.pdf)" = '%PDF'
          pages=$(pdfinfo DimassiSjoestrand.pdf | awk '/^Pages:/ {print $2}')
          echo "Pages: $pages"
          test "$pages" = '240'

      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DimassiSjoestrand.pdf
          git commit -m 'Add Dimassi-Sjostrand background reference'
          git push origin HEAD:Background-material
