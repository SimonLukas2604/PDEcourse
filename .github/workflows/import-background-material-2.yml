name: Import background material 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-background-material-2.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Background-material
      - name: Check staging files
        run: |
          test -d .upload
          test "$(find .upload -type f -name 'pdepart_*' | wc -l)" -eq 8
          wc -c .upload/pdepart_*
      - name: Decode archive
        run: |
          cat .upload/pdepart_00 .upload/pdepart_01 .upload/pdepart_02 .upload/pdepart_03 .upload/pdepart_04 .upload/pdepart_05 .upload/pdepart_06 .upload/pdepart_07 | tr -d '\n\r' > /tmp/archive.b64
          base64 --decode /tmp/archive.b64 > /tmp/pde_files.tgz
          gzip -t /tmp/pde_files.tgz
          tar -tzf /tmp/pde_files.tgz
      - name: Extract and verify sizes
        run: |
          tar -xzf /tmp/pde_files.tgz -C .
          test "$(wc -c < 'Magnetic tunneling(7).tex')" -eq 67885
          test "$(wc -c < 'Multiple WellsI(6).tex')" -eq 110631
          rm -rf .upload
      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add background material"
      - name: Push branch
        run: git push origin HEAD:Background-material
