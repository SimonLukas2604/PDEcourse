name: Import background material

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-background-material.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Background-material
      - name: Check staging files
        run: |
          ls -la .upload
          wc -c .upload/pdepart_*
      - name: Decode archive
        run: |
          cat .upload/pdepart_* > /tmp/archive.b64
          base64 -d /tmp/archive.b64 > /tmp/pde_files.tgz
          tar -tzf /tmp/pde_files.tgz
      - name: Extract files
        run: |
          tar -xzf /tmp/pde_files.tgz -C .
          test -f 'Magnetic tunneling(7).tex'
          test -f 'Multiple WellsI(6).tex'
          wc -c 'Magnetic tunneling(7).tex' 'Multiple WellsI(6).tex'
          rm -rf .upload
      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add background material"
      - name: Push branch
        run: git push origin HEAD:Background-material
