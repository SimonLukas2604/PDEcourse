name: Import background material

on:
  push:
    branches:
      - Background-material
    paths:
      - '.github/workflows/import-background-material.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Background-material
      - name: Restore uploaded TeX files
        shell: bash
        run: |
          cat .upload/pdepart_* > /tmp/archive.b64
          base64 -d /tmp/archive.b64 > /tmp/pde_files.tgz
          tar -xzf /tmp/pde_files.tgz -C .
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add background material"
          git push origin HEAD:Background-material
